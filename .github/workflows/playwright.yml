
name: Playwright Automation Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    name: Run pytest-bdd tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Install Allure CLI
        run: npm install --global allure-commandline

      - name: Run automated tests
        id: pytest
        continue-on-error: true
        run: |
          python -m pytest -v --tb=short \
            --alluredir=allure-results \
            --clean-alluredir

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && \
             find allure-results -type f -name '*-result.json' \
             -print -quit | grep -q .; then
            allure generate allure-results \
              --clean -o allure-report
          else
            echo "No Allure test results found."
            exit 1
          fi

      - name: Upload Allure HTML report artifact
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v6
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('allure-report/index.html') != ''
        uses: actions/configure-pages@v5

      - name: Upload report for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy Allure report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('allure-report/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to workflow summary
        if: steps.deployment.outcome == 'success'
        run: |
          echo "## Allure Test Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
