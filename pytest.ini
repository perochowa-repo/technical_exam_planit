[pytest]
base_url = http://jupiter.cloud.planittesting.com
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
log_cli = true
log_cli_level = INFO
markers =
    smoke: critical tests that verify the main functionality
    regression: tests that verify existing functionality
    validation: tests that verify input validation
    homepage: tests related to the homepage